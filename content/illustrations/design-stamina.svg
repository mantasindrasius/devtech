<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>Good design sustains delivery</title>
  <desc>A conceptual adaptation of Martin Fowler's Design Stamina Hypothesis. Without design, cumulative functionality rises faster initially but flattens; with good design, delivery continues and overtakes it. No measured data or numerical scale.</desc>
  <text x="100" y="155" class="chart-heading">Good design sustains delivery.</text>

  <g fill="none" class="chart-grid" stroke-width="1">
    <path d="M230 310H1440M230 420H1440M230 530H1440" opacity=".45"/>
    <path d="M230 265V655H1440" stroke-width="2"/>
  </g>
  <text transform="translate(155 495) rotate(-90)" text-anchor="middle" font-size="23" class="chart-muted">Cumulative functionality</text>
  <text x="835" y="705" text-anchor="middle" font-size="23" class="chart-muted">Time</text>
  <path d="M240 645C365 535 470 474 635 454S1080 431 1415 425" fill="none" class="chart-poor" stroke-width="6" stroke-linecap="round"/>
  <path d="M240 645C370 615 465 553 570 505S1040 335 1415 260" fill="none" class="chart-good" stroke-width="6" stroke-linecap="round"/>
  <path d="M708 300V655" fill="none" class="chart-grid" stroke-width="2" stroke-dasharray="7 8"/>
  <text x="730" y="321" font-size="21" class="chart-muted">Design payoff</text>
  <text x="1180" y="249" font-size="27" class="chart-accent">Good design</text>
  <text x="1170" y="474" font-size="27" class="chart-poor-label">No design</text>
  <a href="https://martinfowler.com/bliki/DesignStaminaHypothesis.html" target="_blank" rel="noopener noreferrer">
    <text x="100" y="850" class="chart-muted" font-size="19">Source: Martin Fowler · Design Stamina Hypothesis (2007) · Conceptual illustration</text>
  </a>
</svg>
