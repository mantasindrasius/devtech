<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>Save your prompts, maintain your skills</title>
  <desc>An editor-style file explorer showing selected folders in the .agents/skills directory with pr-lifecycle, clean-code, planning, deep-modules, refactor and fluent-tests skills, each containing SKILL.md.</desc>
  <defs>
    <g id="skill-folder" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M0 4H10L14 8H28V25H0Z"/>
    </g>
    <g id="skill-file" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M2 0H17L25 8V29H2Z M17 0V8H25"/>
      <path d="M7 15V23 M7 15L12 20L17 15V23"/>
    </g>
    <path id="skill-chevron" d="M0 0L6 6L12 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </defs>
  <text x="80" y="150" class="chart-heading">Save your prompts, maintain your skills</text>
  <rect x="430" y="220" width="740" height="620" rx="14" style="fill: var(--surface, #15191f); stroke: var(--border, #30363e)" stroke-width="2"/>
  <text x="465" y="265" class="chart-muted" font-size="21" letter-spacing="3">EXPLORER</text>
  <text x="1118" y="265" class="chart-muted" font-size="28">···</text>
  <path d="M430 288H1170" class="chart-grid" stroke-width="1"/>
  <g transform="translate(100 0)" font-family="'SFMono-Regular', Consolas, monospace" font-size="28" style="fill: var(--text, #e8ecf0)">
    <use href="#skill-chevron" x="365" y="317" style="color: var(--muted, #929daa)"/>
