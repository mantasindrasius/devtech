<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>Code metrics for the rescue</title>
  <desc>Explore Lizard output, compare low and high CRAP examples, then review a simulated agent's PR cleanup report.</desc>
  <text x="80" y="150" class="chart-heading">Code metrics for the rescue</text>
  <g font-size="31">
    <g data-bullet="1">
      <circle cx="92" cy="287" r="5" class="chart-accent"/>
      <text x="120" y="299">Cyclomatic complexity tools,</text>
      <text x="120" y="342">such as <tspan font-family="monospace" class="chart-accent">lizard</tspan>.</text>
      <text x="120" y="390" font-size="23" class="chart-muted">Find too many execution paths.</text>
    </g>
    <g data-bullet="2">
      <circle cx="92" cy="477" r="5" class="chart-accent"/>
      <text x="120" y="489" class="chart-accent" font-weight="600">CRAP index</text>
      <text x="120" y="532" font-size="26">Identify complex, untested code.</text>
      <text x="120" y="575" font-size="23" class="chart-muted">Complexity + test coverage.</text>
    </g>
    <g data-bullet="3">
      <circle cx="92" cy="667" r="5" class="chart-accent"/>
      <text x="120" y="679">Make refactoring and cleanup</text>
      <text x="120" y="722">part of the PR.</text>
      <text x="120" y="770" font-size="23" class="chart-muted">Measure → test → simplify → verify.</text>
    </g>
  </g>
  <g data-appears-at="1" data-disappears-at="2">
    <foreignObject x="650" y="235" width="870" height="590">
      <div xmlns="http://www.w3.org/1999/xhtml" class="metrics-terminal">
        <header>LIZARD · DOCUMENTED CLI OUTPUT EXCERPT</header>
        <pre>$ lizard mahjong_game/src</pre>
        <div class="lizard-columns">
          <span>Code<br/>lines<b>↓</b></span>
          <span>Complexity<b>↓</b></span>
          <span>Token<br/>count<b>↓</b></span>
          <span>Parameter<br/>count<b>↓</b></span>
          <span>Function @ line @ file<b>↓</b></span>
        </div>
        <pre class="lizard-output">   NLOC      CCN      token     param   function@line@file
------------------------------------------------------------------------
    10        2         29        2     start_new_player@26@html_game.c
    6         1         3         0     set_shutdown_flag@449@httpd.c
    24        3         61        1     server_main@454@httpd.c

!!!! Warnings (CCN &gt; 15) !!!!
    66        19       247        1     accept_request@64@httpd.c</pre>
        <p>NLOC: non-comment lines · CCN: cyclomatic complexity</p>
        <a href="https://github.com/terryyin/lizard/blob/master/README.rst" target="_blank" rel="noopener noreferrer">Source: Lizard README · Example use</a>
      </div>
    </foreignObject>
  </g>
  <g data-appears-at="2" data-disappears-at="3">
    <text x="670" y="265" font-size="31" class="chart-accent">LOW CRAP · 2</text>
    <text x="670" y="305" font-size="23" class="chart-muted">C = 2 · Assumed coverage: 100% · Green = covered</text>
  </g>
  <g data-appears-at="3" data-disappears-at="4">
    <text x="670" y="265" font-size="31" style="fill: var(--error, #ef7d86)">HIGH CRAP · 42</text>
    <text x="670" y="305" font-size="23" class="chart-muted">C = 6 · Assumed coverage: 0% · Red = uncovered</text>
  </g>
  <g data-appears-at="2" data-disappears-at="4">
    <foreignObject x="650" y="330" width="870" height="550">
      <div xmlns="http://www.w3.org/1999/xhtml" class="metrics-editor"></div>
    </foreignObject>
  </g>
  <g data-appears-at="4">
    <foreignObject x="650" y="235" width="870" height="645">
      <div xmlns="http://www.w3.org/1999/xhtml" class="metrics-chat">
        <header>SIMULATED PR REVIEW · ILLUSTRATIVE METRICS</header>
        <article><strong>You</strong><p>Review this PR's growth. Clean up before calling it done.</p></article>
        <article style="--reply-delay: 900ms"><strong>Agent · compared base → PR</strong>
          <pre>File                 LOC before → after
checkout.ts                 180 → 340 (+160)
shipping.ts                  64 → 118 (+54)
notifications.ts             92 → 156 (+64)</pre>
        </article>
        <article style="--reply-delay: 2100ms"><strong>Agent · risk increased</strong>
          <pre>Function         C       Coverage     CRAP
shipping         2 → 6   100% → 0%     2 → 42
classifyOrder    3 → 8   100% → 50%    3 → 16</pre>
        </article>
        <article style="--reply-delay: 3400ms"><strong>Agent · cleanup plan</strong>
          <p>Add shipping-policy tests. Separate notification delivery from checkout. Simplify classifyOrder. Re-run tests, coverage and complexity checks.</p>
        </article>
      </div>
    </foreignObject>
  </g>
</svg>
