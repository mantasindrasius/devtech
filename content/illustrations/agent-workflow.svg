<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>How coding agents work</title>
  <desc>Three click-revealed phases: Explore, Plan changes, Implement. Each plays an illustrative transcript of tool calls that arrive one at a time, run and return a result. Planning continues exploration; implementation includes verification.</desc>
  <!-- Each tool call waits data-think-ms, then runs for data-run-ms before its result appears. -->
  <defs>
    <clipPath id="workflow-transcript-window"><rect width="440" height="345" rx="12"/></clipPath>
  </defs>
  <text x="80" y="75" class="chart-accent" font-size="18" letter-spacing="4">AGENTS / FROM CONTEXT TO CHANGE</text>
  <text x="80" y="150" class="chart-heading">How coding agents work</text>
  <text x="80" y="203" class="chart-muted" font-size="25">A useful workflow, not a rigid pipeline. New evidence sends the agent back.</text>
  <g data-appears-at="1">
    <text x="80" y="285" font-size="34" font-weight="600">01 / Explore</text>
    <text x="80" y="325" class="chart-muted" font-size="23">Find the relevant context.</text>
    <g class="tool-transcript" transform="translate(80 350)" clip-path="url(#workflow-transcript-window)">
      <g class="tool-stream">
        <g transform="translate(0 0)">
          <g class="tool-call" data-think-ms="900" data-run-ms="350">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Glob</text>
            <text x="20" y="66" font-size="21" class="chart-muted">src/**/*.ts → locate files</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">38 files</text>
          </g>
        </g>
        <g transform="translate(0 100)">
          <g class="tool-call" data-think-ms="500" data-run-ms="600">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Grep</text>
            <text x="20" y="66" font-size="21" class="chart-muted">quote → find symbols &amp; callers</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">12 matches</text>
          </g>
        </g>
        <g transform="translate(0 200)">
          <g class="tool-call" data-think-ms="700" data-run-ms="450">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Read</text>
            <text x="20" y="66" font-size="21" class="chart-muted">pricing.ts → inspect behavior</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">214 lines</text>
          </g>
        </g>
        <g transform="translate(0 300)">
          <g class="tool-call" data-think-ms="1200" data-run-ms="900">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">LSP</text>
            <text x="20" y="66" font-size="21" class="chart-muted">findReferences → follow links</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">9 references</text>
          </g>
        </g>
        <g transform="translate(0 400)">
          <g class="tool-call" data-think-ms="600" data-run-ms="1100">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Bash</text>
            <text x="20" y="66" font-size="21" class="chart-muted">rg --files → map the repo</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">126 paths</text>
          </g>
        </g>
        <g transform="translate(0 500)">
          <g class="tool-call" data-think-ms="400" data-run-ms="400">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Read</text>
            <text x="20" y="66" font-size="21" class="chart-muted">pricing.test.ts → learn contracts</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">88 lines</text>
          </g>
        </g>
      </g>
      <g class="tool-thinking" transform="translate(22 320)">
        <circle r="5"/>
        <circle cx="18" r="5"/>
        <circle cx="36" r="5"/>
        <text x="58" y="7" font-size="20">Thinking…</text>
      </g>
    </g>
  </g>
  <g data-appears-at="2">
    <text x="580" y="285" font-size="34" font-weight="600">02 / Plan changes</text>
    <text x="580" y="325" class="chart-muted" font-size="23">Keep exploring. Decide what changes.</text>
    <text x="537" y="285" class="chart-accent" font-size="32">→</text>
    <g class="tool-transcript" transform="translate(580 350)" clip-path="url(#workflow-transcript-window)">
      <g class="tool-stream">
        <g transform="translate(0 0)">
          <g class="tool-call" data-think-ms="1400" data-run-ms="300">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">EnterPlanMode</text>
            <text x="20" y="66" font-size="21" class="chart-muted">Investigate before editing</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">read-only</text>
          </g>
        </g>
        <g transform="translate(0 100)">
          <g class="tool-call" data-think-ms="600" data-run-ms="450">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Read</text>
            <text x="20" y="66" font-size="21" class="chart-muted">contracts.ts → check boundaries</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">61 lines</text>
          </g>
        </g>
        <g transform="translate(0 200)">
          <g class="tool-call" data-think-ms="500" data-run-ms="650">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Grep</text>
            <text x="20" y="66" font-size="21" class="chart-muted">quote → assess affected callers</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">7 callers</text>
          </g>
        </g>
        <g transform="translate(0 300)">
          <g class="tool-call" data-think-ms="1600" data-run-ms="3200">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">AskUserQuestion</text>
            <text x="20" y="66" font-size="21" class="chart-muted">Clarify an ambiguous requirement</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">answered</text>
          </g>
        </g>
        <g transform="translate(0 400)">
          <g class="tool-call" data-think-ms="2200" data-run-ms="1500">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Plan artifact¹</text>
            <text x="20" y="66" font-size="21" class="chart-muted">Files · approach · risks · tests</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">4 files</text>
          </g>
        </g>
        <g transform="translate(0 500)">
          <g class="tool-call" data-think-ms="700" data-run-ms="2000">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">ExitPlanMode</text>
            <text x="20" y="66" font-size="21" class="chart-muted">Present the proposed approach</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">approved</text>
          </g>
        </g>
      </g>
      <g class="tool-thinking" transform="translate(22 320)">
        <circle r="5"/>
        <circle cx="18" r="5"/>
        <circle cx="36" r="5"/>
        <text x="58" y="7" font-size="20">Thinking…</text>
      </g>
    </g>
  </g>
  <g data-appears-at="3">
    <text x="1080" y="285" font-size="34" font-weight="600">03 / Implement</text>
    <text x="1080" y="325" class="chart-muted" font-size="23">Edit → run checks → repair.</text>
    <text x="1037" y="285" class="chart-accent" font-size="32">→</text>
    <g class="tool-transcript" transform="translate(1080 350)" clip-path="url(#workflow-transcript-window)">
      <g class="tool-stream">
        <g transform="translate(0 0)">
          <g class="tool-call" data-think-ms="800" data-run-ms="400">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Read</text>
            <text x="20" y="66" font-size="21" class="chart-muted">pricing.ts → inspect current code</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">214 lines</text>
          </g>
        </g>
        <g transform="translate(0 100)">
          <g class="tool-call" data-think-ms="1500" data-run-ms="350">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Edit</text>
            <text x="20" y="66" font-size="21" class="chart-muted">Replace a targeted code fragment</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">+6 −2</text>
          </g>
        </g>
        <g transform="translate(0 200)">
          <g class="tool-call" data-think-ms="1300" data-run-ms="400">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Write</text>
            <text x="20" y="66" font-size="21" class="chart-muted">Create pricing-policy.test.ts</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">+48</text>
          </g>
        </g>
        <g transform="translate(0 300)">
          <g class="tool-call" data-think-ms="600" data-run-ms="2600">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Bash</text>
            <text x="20" y="66" font-size="21" class="chart-muted">bun test → verify behavior</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result tool-result--failed">1 failed</text>
          </g>
        </g>
        <g transform="translate(0 400)">
          <g class="tool-call" data-think-ms="500" data-run-ms="400">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Read</text>
            <text x="20" y="66" font-size="21" class="chart-muted">Test output → diagnose failure</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">23 lines</text>
          </g>
        </g>
        <g transform="translate(0 500)">
          <g class="tool-call" data-think-ms="1700" data-run-ms="350">
            <rect width="440" height="88" rx="10" class="tool-card"/>
            <text x="20" y="33" class="tool-name">Edit</text>
            <text x="20" y="66" font-size="21" class="chart-muted">Fix → run the checks again</text>
            <circle cx="408" cy="26" r="9" class="tool-spinner"/>
            <text x="420" y="32" class="tool-result">+3 −1</text>
          </g>
        </g>
      </g>
      <g class="tool-thinking" transform="translate(22 320)">
        <circle r="5"/>
        <circle cx="18" r="5"/>
        <circle cx="36" r="5"/>
        <text x="58" y="7" font-size="20">Thinking…</text>
      </g>
    </g>
  </g>
  <g data-appears-at="2">
    <text x="80" y="760" font-size="24">¹ Planning is reasoning + a proposed plan, not a universal “Plan” tool.</text>
  </g>
  <text x="80" y="814" class="chart-muted" font-size="20">Illustrative Claude Code calls · Tool availability varies · Edit performs string replacement</text>
  <text x="80" y="850" class="chart-muted" font-size="18">Sources: Anthropic workflow guidance · code.claude.com/docs/en/tools-reference</text>
</svg>
