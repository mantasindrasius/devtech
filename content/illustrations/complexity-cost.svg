<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>The complexity tax: code-level maintainability and review-and-fix tokens per PR</title>
  <desc>Fitted estimates: unhealthy CodeHealth 2.8 is normalized to 100. Healthy CodeHealth 9.7 costs 65 for DeepSeek, 71.1 for Qwen and 78.2 for Sonnet. Not full-lifecycle costs or causal savings.</desc>
  <text x="100" y="75" class="chart-accent" font-size="18" letter-spacing="4">CODE / THE ECONOMICS OF CHANGE</text>
  <text x="100" y="146" class="chart-heading">The complexity tax.</text>
  <text x="100" y="194" class="chart-muted" font-size="26">Healthier code was associated with fewer review-and-fix tokens per PR.</text>
  <rect x="100" y="232" width="18" height="18" class="chart-poor-label"/>
  <text x="130" y="249" font-size="22">Unhealthy · CodeHealth 2.8</text>
  <rect x="585" y="232" width="18" height="18" class="chart-accent"/>
  <text x="615" y="249" font-size="22">Healthy · CodeHealth 9.7</text>
  <g class="chart-grid" fill="none">
    <path d="M380 285V637M610 285V637M840 285V637M1070 285V637M1300 285V637"/>
  </g>
  <g font-size="25">
    <text x="100" y="333">DeepSeek V4 Flash</text>
    <text x="100" y="453">Qwen3-6</text>
    <text x="100" y="573">Sonnet 5</text>
  </g>
  <g class="chart-poor-label">
    <rect x="380" y="300" width="920" height="24" rx="4"/>
    <rect x="380" y="420" width="920" height="24" rx="4"/>
    <rect x="380" y="540" width="920" height="24" rx="4"/>
  </g>
  <g class="chart-accent">
    <rect x="380" y="336" width="598" height="24" rx="4"/>
    <rect x="380" y="456" width="654.12" height="24" rx="4"/>
    <rect x="380" y="576" width="719.44" height="24" rx="4"/>
  </g>
  <g font-size="24" class="chart-accent">
    <text x="998" y="357">65</text><text x="1054" y="477">71.1</text><text x="1119" y="597">78.2</text>
  </g>
  <g font-size="30" font-weight="600" class="chart-accent" text-anchor="end">
    <text x="1490" y="350">−35.0%</text><text x="1490" y="470">−28.9%</text><text x="1490" y="590">−21.8%</text>
  </g>
  <g text-anchor="middle" font-size="20" class="chart-muted">
    <text x="380" y="664">0</text><text x="610" y="664">25</text><text x="840" y="664">50</text>
    <text x="1070" y="664">75</text><text x="1300" y="664">100</text>
    <text x="840" y="704" font-size="24">Estimated token index · unhealthy = 100 for each model</text>
  </g>
  <text x="100" y="760" font-size="23">CodeHealth includes complex methods, deep nesting and duplicated logic.</text>
  <text x="100" y="801" class="chart-muted" font-size="20">465 PRs · Composite metric, not complexity alone · Whole-file size absorbed the association</text>
  <text x="100" y="837" class="chart-muted" font-size="20">Review + fixes only; full implementation-to-merge cost remains an open question.</text>
  <a href="https://arxiv.org/html/2610.21914v1" target="_blank" rel="noopener noreferrer">
    <text x="100" y="877" class="chart-muted" font-size="18">Source: Gullstrand Heander et al., 2026 · §4.2 fitted estimates · arXiv:2610.21914</text>
  </a>
</svg>
