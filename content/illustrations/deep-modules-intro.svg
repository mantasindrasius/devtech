<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>Deep modules</title>
  <desc>The title Deep modules fills the slide, then settles into a heading. Four short points about deep modules beside two outline boxes: a shallow module with a wide interface over a thin body, and a deep module with a narrow interface over a tall body.</desc>
  <g data-appears-at="0" data-disappears-at="1">
    <text x="80" y="330" class="topic-kicker">ARCHITECTURE FOR AGENTS</text>
  </g>
  <text x="80" y="150" class="chart-heading topic-title">Deep modules</text>

  <g data-appears-at="1">
  <g font-size="40">
    <g style="fill: var(--accent, #b4ef94)">
      <circle cx="94" cy="296" r="7"/>
      <circle cx="94" cy="416" r="7"/>
      <circle cx="94" cy="536" r="7"/>
      <circle cx="94" cy="656" r="7"/>
    </g>
    <text x="130" y="310">Small interface, lots of behaviour.</text>
    <text x="130" y="430">Interface = all a caller must know.</text>
    <text x="130" y="550">Depth ≠ lines of code.</text>
    <text x="130" y="670">Delete it: does complexity spread?</text>
  </g>

  <rect x="1000" y="262" width="440" height="34" rx="6" class="chart-poor" stroke-width="3" style="fill: var(--blue, #82b7da); fill-opacity: 0.3"/>
  <rect x="1000" y="296" width="440" height="50" rx="6" class="chart-grid" fill="none" stroke-width="2"/>
  <text x="1220" y="398" text-anchor="middle" class="chart-muted" font-size="30">shallow</text>

  <rect x="1150" y="470" width="140" height="34" rx="6" class="chart-good" stroke-width="3" style="fill: var(--accent, #b4ef94); fill-opacity: 0.3"/>
  <rect x="1000" y="504" width="440" height="230" rx="6" class="chart-good" stroke-width="2" style="fill: var(--accent, #b4ef94); fill-opacity: 0.08"/>
  <text x="1220" y="786" text-anchor="middle" class="chart-muted" font-size="30">deep</text>

  <text x="80" y="850" class="chart-muted" font-size="18">John Ousterhout, A Philosophy of Software Design</text>
  </g>
</svg>
