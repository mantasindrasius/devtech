<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940">
<title>Testable design</title>
<desc>An application core holding four deep modules is covered by a component test suite that runs in memory, each test passing within 100 milliseconds. A click adds ports and adapters to web services, reporting, a user interface, persistence, messaging and payments, all covered by an end-to-end suite whose tests take from half a second to three seconds.</desc>
<defs><marker id="hex-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="currentColor" stroke-width="1.5"/></marker></defs>
<text x="100" y="118" class="chart-heading">Testable design</text>
<!-- Each test-run takes data-run-ms and flashes the elements whose ids are in data-targets. -->
<g data-appears-at="0">
  <g class="test-suite suite-component" transform="translate(1150 196)">
    <text class="suite-title" y="24">Component tests · in memory</text>
