<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>Ease of change: monolithic and decoupled architecture</title>
  <desc>Side-by-side comparison of a tightly coupled monolith with a decoupled architecture. Decoupling can also be achieved within a modular monolith.</desc>
  <text x="100" y="80" class="chart-accent" font-size="18" letter-spacing="4">ARCHITECTURE / EASE OF CHANGE</text>
  <text x="100" y="157" class="chart-heading">Ease of change</text>
  <path d="M800 265V715" class="chart-grid" fill="none" stroke-width="2"/>
  <path d="M100 270H710" class="chart-poor" fill="none" stroke-width="4"/>
  <path d="M890 270H1500" class="chart-good" fill="none" stroke-width="4"/>
  <text x="100" y="332" font-size="35" font-weight="600">Monolithic architecture</text>
  <text x="100" y="374" class="chart-muted" font-size="24">When dependencies are tightly coupled</text>
  <text x="890" y="332" font-size="35" font-weight="600">Decoupled architecture</text>
  <text x="890" y="374" class="chart-muted" font-size="24">When boundaries keep changes local</text>
  <g class="chart-poor-label">
    <circle cx="109" cy="457" r="5"/><circle cx="109" cy="548" r="5"/><circle cx="109" cy="639" r="5"/>
  </g>
  <g class="chart-accent">
    <circle cx="899" cy="457" r="5"/><circle cx="899" cy="548" r="5"/><circle cx="899" cy="639" r="5"/>
  </g>
  <g font-size="30">
    <text x="134" y="467">Intertwined file-level dependencies</text>
    <text x="134" y="558">Logic scattered across many places</text>
    <text x="134" y="649">Changes are difficult and risky</text>
    <text x="924" y="467">Organized dependencies</text>
    <text x="924" y="558">Modular design</text>
    <text x="924" y="649">Faster, lower-cost development</text>
  </g>
  <text x="100" y="804" font-size="27">Good boundaries make change easier.</text>
  <text x="100" y="849" class="chart-muted" font-size="23">A modular monolith can be decoupled too. Deployment style alone does not determine modularity.</text>
</svg>
