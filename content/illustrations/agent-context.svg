<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>Same change. Different context.</title>
  <desc>Illustrative agent attention: three subagents hop between scattered domain fragments of a tightly coupled monolith, pausing at each to make tool calls; a focused agent works inside the Billing module of a modular design. Each agent shows an illustrative token count; the monolith's agents fill their context three times faster and pause to compact it. Orange heat indicates attention, not measured cost.</desc>
  <!-- Each agent visits its agent-stop modules in order, making the data-calls (separated by |) at each.
       data-context-rate multiplies how fast those calls fill the agent's context window;
       data-context-start (tokens) staggers agents so they do not all compact together. -->
  <text x="80" y="118" class="chart-heading">Same change. Different context.</text>
