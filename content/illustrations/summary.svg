  <text x="100" y="158" class="chart-heading">Summary</text>
  <g class="chart-accent">
    <circle data-bullet="1" cx="111" cy="297" r="6"/>
    <circle data-bullet="2" cx="111" cy="427" r="6"/>
    <circle data-bullet="3" cx="111" cy="557" r="6"/>
    <circle data-bullet="4" cx="111" cy="687" r="6"/>
