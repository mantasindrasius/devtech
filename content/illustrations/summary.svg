  <g font-size="36">
    <text data-bullet="1" x="144" y="309">Our job has rapidly shifted and it's still in progress.</text>
    <text data-bullet="2" x="144" y="419">Invest in your code-base to keep your agents'<tspan x="144" dy="48"><tspan class="chart-accent" font-weight="700">velocity</tspan> and <tspan class="chart-accent" font-weight="700">reliability</tspan>.</tspan></text>
    <text data-bullet="3" x="144" y="569">Don't let the <tspan class="chart-accent" font-weight="700">Vibe coding</tspan> become <tspan class="chart-accent" font-weight="700">Vibe neglection</tspan>.</text>
