    label: LEGACY
    title:
      - text: Should we rewrite for agents?
    description: Compare replacement with a safer path through the existing system.
    code: introduction
    takeaway: Rewrite deliberately. Preserve what the business depends on.
    notes: >-
      [30:22–31:29 · 67 seconds]


      Evaluate rewriting a bounded capability when it removes substantial accidental complexity and
      behavior can be preserved and verified. Compare domain knowledge, migration cost,
      compatibility, parallel running and rollback. Prefer incremental replacement where uncertainty
      is high. A whole-system rewrite is not the default; optimized code with lost behavior is not
      progress.
