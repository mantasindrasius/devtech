  - id: agent-exploration
    name: How agents explore
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: How agents explore
    description: Find the entry point. Trace the contract. Locate the proof.
    code: introduction
    takeaway: Make discovery a short path.
    notes: >-
      [4:30–5:28 · 58 seconds]


      Walk through a real change: where is the capability, what can change, and how will I know?
      Agents vary in tools and strategy; this is a useful workflow, not a claim about every model.
      Give each package an entry point, a public contract and a fast check.
    steps:
      - id: message
        label: How agents explore
        panel: agent-exploration
        reveal:
          - description
          - principles
          - takeaway
  - id: agent-struggle
    name: A small task. A huge context.
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: A small task. A huge context.
    description: Hidden coupling turns exploration into repeated guessing.
    code: introduction
    takeaway: Context size is a symptom. Coupling is often the cause.
    notes: >-
      [5:28–6:26 · 58 seconds]


      Complex architecture forces broad retrieval: callers, shared mutable state, implicit ordering
      and infrastructure. A larger context window does not remove ambiguity. Look for repeated
      searches, retries and unrelated files touched. Preserve headroom for the task, tool output and
      review.
    steps:
      - id: message
        label: A small task. A huge context.
        panel: context-burden
        reveal:
          - description
          - principles
          - takeaway
  - id: velocity-cost
    name: Measure velocity, quality & cost
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: Measure velocity, quality & cost
    description: Count accepted outcomes, including retries, review and regressions.
    code: introduction
    takeaway: Cost per accepted task is the useful denominator.
    notes: >-
      [6:26–7:29 · 63 seconds]


      These curves illustrate the hypothesis, not empirical results. Track comparable tasks,
      model/toolchain, elapsed time, token spend, human review and production regressions. Do not
      reward output volume alone.
    steps:
      - id: message
        label: Measure velocity, quality & cost
        panel: velocity-curve
        reveal:
          - description
          - principles
          - takeaway
      - id: cost
        label: Cost per accepted task
        panel: cost-curve
        reveal:
          - description
          - principles
          - takeaway
  - id: reasoning-budget
    name: The “stupid agents” rule
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: The “stupid agents” rule.
    description:
      Make routine changes simple enough for less capable models. Give frontier models less
      work to untangle.
    code: introduction
    takeaway: Spend reasoning on the problem.
    notes: >-
      [7:29–8:32 · 63 seconds]


      This is a design goal and an empirical hypothesis. Smaller models still have limits; better
      structure does not guarantee correctness. Compare representative tasks and retain the same
      acceptance bar.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
        panel: reasoning-budget
  - id: deep-module-concept
    name: Small interface. Deep capability.
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: Small interface. Deep capability.
    description: Small packages and functions; cohesive knowledge behind a stable contract.
    code: introduction
    takeaway: Hide decisions that callers should not own.
    notes: >-
      [8:32–9:25 · 53 seconds]


      Deep modules hide substantial implementation behind a simple interface. Avoid a package per
      helper: that moves orchestration to every caller. Small is about cognitive surface, not
      arbitrary line counts. Matt Pocock draws on John Ousterhout. Existing research links:
      https://github.com/mattpocock/skills/blob/main/skills/engineering/codebase-design/SKILL.md
    steps:
      - id: message
        label: Small interface. Deep capability.
        panel: deep-module
        reveal:
          - description
          - principles
          - takeaway
  - id: cohesive-packages
    name: 'Example: one quote capability'
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: One quote capability.
    description: Hide meaningful complexity. Keep related knowledge together.
    code: shallow-quote
    takeaway: Reduce what callers must know, not just file length.
    notes: >-
      [9:25–11:11 · 106 seconds]


      Small does not mean a package per function. Avoid forcing one feature across many fragments. A
      modular monolith can provide these boundaries without distributed-system costs.


      Matt Pocock advocates deep modules, drawing on John Ousterhout. A module may be a function,
      class, package, or larger slice. Interface includes errors, invariants, configuration, and
      performance, not merely types. These quote snippets are illustrative excerpts, not a runnable
      package. Ask the deletion test: would removing the module spread its knowledge across callers,
      or remove empty indirection? Four beats, about 25 seconds each. Sources:
      https://github.com/mattpocock/skills/blob/main/skills/engineering/codebase-design/SKILL.md and
      https://github.com/mattpocock/skills/blob/main/skills/engineering/codebase-design/DEEPENING.md
    steps:
      - id: shallow
        label: 'BAD: the caller coordinates the policy'
        panel: shallow-quote
        reveal:
          - description
          - takeaway
      - id: deep
        label: 'GOOD: one capability hides the workflow'
        panel: deep-quote
        reveal:
          - description
          - takeaway
      - id: seam
        label: The same interface serves callers and tests
        panel: deep-module
        reveal:
          - description
          - takeaway
      - id: package
        label: Private helpers, explicit public exports
        panel: quote-package
        reveal:
          - description
          - takeaway
  - id: start-modular
    name: Monolith or microservices?
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: Monolith or microservices?
    description: Start with module boundaries. Split deployment when there is a reason.
    code: introduction
    takeaway: Modularity is a design choice. Distribution has a cost.
    notes: >-
      [11:11–12:14 · 63 seconds]


      A modular monolith can be a good starting point when one deployment and shared operations fit
      the team. Extract a service for independently justified scaling, isolation, ownership or
      release needs. Account for latency, failure modes, consistency and observability. A process
      boundary does not repair a weak module boundary.
    steps:
      - id: message
        label: Monolith or microservices?
        panel: package-boundaries
        reveal:
          - description
          - principles
          - takeaway
  - id: composition-deployment
    name: Compose capabilities. Choose deployment.
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: Compose capabilities. Choose deployment.
    description: Keep business policy independent of transport and hosting.
    code: composition-deployment
    takeaway: Make the safe deployment path executable.
    notes: >-
      [12:14–13:23 · 69 seconds]


      Use factories, adapters and strategies to compose explicit contracts. Deployment flexibility
      is not free: local and remote calls differ in failure and consistency. Agents can produce
      plausible but unsafe infrastructure changes; do not assume operational competence from code
      competence. Provide approved templates, least-privilege capabilities, dry runs, rollout gates
      and rollback evidence.
    steps:
      - id: message
        label: Compose capabilities. Choose deployment.
        panel: composition-deployment
        reveal:
          - description
          - principles
          - takeaway
  - id: frontend-modules
    name: Deep modules belong in the frontend too
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: Deep modules belong in the frontend too
    description: A user capability owns state, validation and effects.
    code: frontend-module
    takeaway: The UI should not coordinate every policy.
    notes: >-
      [13:23–14:21 · 58 seconds]


      A checkout module can hide asynchronous state transitions and validation without hiding
      user-visible errors. Keep rendering separate from policy. Test user behavior through the
      public contract; avoid exposing internal setters to satisfy tests. Small components alone do
      not guarantee a simple feature.
    steps:
      - id: message
        label: Deep modules belong in the frontend too
        panel: frontend-module
        reveal:
          - description
          - principles
          - takeaway
