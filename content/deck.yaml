    description: Confidence to ship faster and more frequently.
    code: introduction
    takeaway: Tests make intended behavior executable and verifiable.
    notes: >-
      Agents increase the volume and speed of changes, making trustworthy guardrails essential.
      Fast automated tests are a cheap, repeatable feedback mechanism. Keep the suite maintained
      so a green result supports deployment confidence. Shift review attention toward whether
      tests specify the right behavior, cover meaningful failures and assert real outcomes;
      this does not eliminate implementation, security or architectural review. Agents can run
      tests and repair their own changes, but an agent writing both code and tests can repeat
      the same misunderstanding in both. Review the specification independently. Testable
      designs tend to make dependencies and responsibilities explicit. Tests are a living
      specification, not proof that every requirement or production risk is covered.
