slides:
  - id: opening
    name: Designing Architectures that AI can work with
    label: OPENING
    title:
      - text: Designing Architectures
      - accent: that AI can work with
    description: From a local change to production evidence.
    code: introduction
    takeaway: Make correct changes ordinary.
    notes: >-
      [0:00–0:32 · 32 seconds]


      Introduce yourself. This talk is about the environment around AI coding, not a prompt recipe.
      We will follow an order-processing change from code to production.
    steps:
      - id: message
        label: The idea
        reveal:
          - description
          - author
          - principles
          - takeaway
    author: true
  - id: about-me
    name: About me
    label: OPENING
    title:
      - text: About me.
      - accent: Code, people, circuits.
    description: Full-stack developer at Innovations Vilnius. AI-first since Claude 4.0 (June 2025).
    code: about-me
    takeaway: 13 years at Wix · 3 kids · Embedded Software & Electronics
    notes: >-
      [0:32–1:09 · 37 seconds]


      I have spent 13 years at Wix and currently work at Innovations Vilnius. I am a full-stack
      developer, a parent of three, and I enjoy Embedded Software and Electronics. I have worked
      AI-first since June 2025, during the Claude 4.0 era. Keep this personal introduction brief,
      then connect the maker mindset to designing systems that people and AI can understand.
    steps:
      - id: introduction
        label: About me
        reveal:
          - description
          - author
          - takeaway
    author: true
  - id: context-cost
    name: Five lines of change. Half a repo of context.
    label: OPENING
    layout: visual
    title:
      - text: Five lines of change.
      - accent: Half a repo of context.
    description: An existing monolith. It works.
    code: introduction
    takeaway: A tiny change can depend on the whole structure.
    notes: >-
      [1:09–3:00 · 111 seconds]


      Start with a working monolith on the language runtime. Advance the clicker through each new
      stacked ring, then each pipe and patch. Let the workarounds accumulate before adding another
      ring. Gas leaks grow stronger and spread to more joints. One final addition blows the lid off
      and throws every temporary patch clear. Brace the damaged monolith to keep it running, then
      begin the rewrite. Build several smaller towers and connect them. The exposed pipes burst and
      get patched; underwater pipes reveal hidden coupling. End on the larger system of workarounds.
      Ask the audience to recall a tiny change that required opening dozens of files. The diff may
      be small while the context needed to change safely spans the system.
    steps:
      - id: existing
        label: Existing monolith
        panel: project-stack
        scene: existing
        caption: The monolith works today.
        reveal:
          - description
      - id: features
        label: Add features
        panel: project-stack
        scene: features
        caption: A new layer grows on top.
        description: New features stack on the existing monolith.
      - id: workaround-pipe
        label: First workaround
        panel: project-stack
        scene: workaround-pipe
        caption: A workaround routes around the seam.
        description: The first workaround connects parts that were not designed together.
      - id: first-patch
        label: First patch
        panel: project-stack
        scene: first-patch
        caption: Seal one leaking joint. Keep shipping.
        description: A bolted plate seals the leaking joint, buying time without removing the dependency.
      - id: quick-fix-pipe
        label: Quick fix
        panel: project-stack
        scene: quick-fix-pipe
        caption: A quick fix adds another path.
        description: Another pipe reaches around the structure.
      - id: dependencies
        label: Another layer
        panel: project-stack
        scene: dependencies
        caption: Another ring lands on the patched system.
        description: The structure grows taller; its boundaries do not get clearer.
      - id: legacy-pipe
        label: Legacy path
        panel: project-stack
        scene: legacy-pipe
        caption: Seal the upper seam. Another leak is still venting.
        description: Old behavior remains connected to the growing system.
      - id: second-patch
        label: Another patch
        panel: project-stack
        scene: second-patch
        caption: Patch the next leaking pipe. Pressure finds another weak point.
        description: The repair becomes part of the design.
      - id: runtime-pipe
        label: Runtime workaround
        panel: project-stack
        scene: runtime-pipe
        caption: Another pipe, another leak to seal.
        description: Workarounds extend across more layers.
      - id: todo-pipe
        label: Unfinished pipe
        panel: project-stack
        scene: todo-pipe
        caption: Patch the lower pipe while the unfinished connection vents.
        description: An unfinished connection waits at the top.
      - id: fixme-pipe
        label: Another unfinished pipe
        panel: project-stack
        scene: fixme-pipe
        caption: Cap the open connection. The next joint starts leaking.
        description: The project now carries unfinished work in its structure.
      - id: failure
        label: Pressure overload
        panel: project-stack
        scene: failure
        caption: The lid blows off. Every temporary patch is thrown clear.
        description: A small change can trigger a system-wide failure.
        reveal:
          - takeaway
      - id: supported
        label: Brace the monolith
        panel: project-stack
        scene: supported
        caption: Keep it standing with braces.
      - id: rewrite
        label: Start the rewrite
        panel: project-stack
        scene: rewrite
        caption: Rewrite to microservices. Start with Auth.
      - id: services
        label: Split into services
        panel: project-stack
        scene: services
        caption: Billing and Search become separate towers.
      - id: service-rings
        label: Grow each service
        panel: project-stack
        scene: service-rings
        caption: Each small tower grows its own layers.
      - id: service-links
        label: Connect the islands
        panel: project-stack
        scene: service-links
        caption: Now the islands need pipes between them.
      - id: first-burst
        label: First burst
        panel: project-stack
        scene: first-burst
        caption: A pipe bursts.
      - id: first-repair
        label: Patch the first pipe
        panel: project-stack
        scene: first-repair
        caption: Patch it and keep moving.
      - id: underwater-pipes
        label: Reveal hidden coupling
        panel: project-stack
        scene: underwater-pipes
        caption: Underwater pipes connect the islands too.
      - id: second-burst
        label: Underwater gas leak
        panel: project-stack
        scene: second-burst
        caption: Gas bubbles rise from a hidden underwater leak.
      - id: second-repair
        label: Patch the hidden pipe
        panel: project-stack
        scene: second-repair
        caption: Another workaround, now below the surface.
      - id: sprawl
        label: The bigger system
        panel: project-stack
        scene: sprawl
        caption: More towers. More pipes. The same problem at a larger scale.
  - id: ai-era
    name: Building in the AI era
    label: OPENING
    layout: visual
    title:
      - text: Building in the AI era.
    description: Fast additions can outpace the structure that keeps a project stable.
    code: introduction
    takeaway: More features do not imply a healthier system.
    notes: >-
      [3:00–4:19 · 79 seconds]


      Each click adds one spacecraft: foreground, left background, then far background. Each begins
      its own construction sequence. Pause to watch physical parts install, a different random
      subset of fairy-tale features bolt to each hull, and leaks emerge. Suited engineers raise
      ladders, remove unwanted features, and patch the exposed holes. More additions return while
      other joints leak; cleanup cannot catch up with generation. The engine incident is contained
      automatically, followed by unstable thrusters.
    steps:
      - id: shipyard
        label: Building in the AI era
        panel: ai-era-spaceship
        scene: shipyard
        caption: Every new project starts with a promise.
      - id: first-ship
        label: Start the first project
        panel: ai-era-spaceship
        scene: first-ship
        caption: Changes arrive. Each one adds something to maintain.
      - id: second-ship
        label: Start another project
        panel: ai-era-spaceship
        scene: second-ship
        caption: Start another project while the first keeps growing.
      - id: third-ship
        label: Three projects. Continuous repairs
        panel: ai-era-spaceship
        scene: third-ship
        caption: Parallel output. A growing game of whack-a-mole.
