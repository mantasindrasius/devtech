  - id: deep-modules-intro
    name: Deep modules
    label: ARCHITECTURE FOR AGENTS
    layout: visual
    title:
      - text: Deep modules
    description: A small interface that hides a lot of useful behaviour.
    code: introduction
    takeaway: Much behaviour behind a small interface.
    notes: >-
      The slide opens as a separator showing only the title; click to settle it into the
      heading and reveal the points. Introduce the idea before the code. A module can be a function, a class, a package or a
      larger slice. Its interface is everything a caller must know: types, invariants, ordering,
      errors, configuration and performance characteristics. Depth means useful behaviour
      behind a small interface, not a large line count. The shallow box has a wide interface
      and little behind it, so every caller coordinates the workflow. The deep box has a
      narrow interface over a tall body: it owns the behaviour. Locality keeps
      related knowledge, changes, bugs and verification together. The deletion test asks
      whether removing the module would spread complexity across callers or merely remove
      indirection. A seam needs a real reason to vary; avoid speculative ports and
      pass-through layers. The concept is Ousterhout's, from A Philosophy of Software Design,
      as advocated in Matt Pocock's skills. The next slide shows the same contrast in code.
    steps:
      - id: title
        label: Deep modules
        panel: deep-modules-intro
        scene: title
        caption: Deep modules.
      - id: points
        label: What makes a module deep
        panel: deep-modules-intro
        scene: points
        caption: A small interface, everything a caller must know, hiding a lot of behaviour.
  - id: deep-modules-comparison
    name: Deep modules
    label: ARCHITECTURE FOR AGENTS
    layout: visual
    title:
      - text: Deep modules
    description: Hide useful complexity behind a small interface.
    code: deep-quote
    takeaway: Expose intent. Hide the workflow and its invariants.
    notes: >-
      Compare these public TypeScript interfaces. The shallow interface exposes mutable
      intermediate state through getters and setters, plus workflow steps. A caller must
      know ordering and maintain consistency. The deep interface accepts inputs and returns
      a quote while hiding validation, pricing and shipping rules. Getters and setters are
      not inherently wrong; exposing internal workflow state is the problem here. Shared
      domain types such as Money and Item are omitted for focus. Contract documentation
      must still define units, errors and guarantees. Read-only Monaco models are isolated
      from saved demo code. Source concept is Ousterhout's deep modules.
      Click to flip both code cards in place into implementation diagrams. Shallow operations
      wrap little behavior; the caller coordinates them. Both interfaces support event
      subscriptions and return Unsubscribe, a cleanup function. StateListener receives
      intermediate pricing-state changes; StepListener receives workflow-step notifications.
      QuoteListener receives the completed Quote. The deep module owns event timing after
      invariants hold. These listener aliases are omitted from the interface excerpts for
      readability. Domain events are part of the public contract, not private state exposure. The deep interface hides a larger,
      cohesive implementation composed of private submodules. The benefit is how much
      capability and complexity it abstracts, not merely having fewer methods. Submodule
      connections are illustrative, not a prescribed dependency graph.
    steps:
      - id: comparison
        label: Shallow versus deep modules
        panel: deep-modules-comparison
        face: interface
      - id: implementation-depth
        label: Look behind the interfaces
        panel: deep-modules-comparison
        face: implementation
  - id: composition-roots
    name: Compose deep modules into an app
    label: ARCHITECTURE FOR AGENTS
    layout: visual
    title:
      - text: Compose deep modules into an app
    description: A composition root wires public capabilities together.
    code: composition-client
    takeaway: Wire at the entry point; keep business policy inside modules.
    notes: >-
      Composition root is the established term for assembling the application's object or
      module graph near its entry point. It may be a dedicated bootstrap module. Prefer
      explicit factories and dependency injection; a container is optional and should not
      leak into domain modules. The server composes catalog, quotes and checkout with
      infrastructure adapters. The client composes cart and checkout capabilities with an
      API adapter and a React root. createRoot mounts App with explicit capability props;
      App can distribute them through scoped context if needed. Modules are created once
      outside React render, avoiding recreation on rerenders. Unmount React before disposing
      the modules so component cleanup runs while dependencies are still alive. These package names and factory APIs are illustrative, not a
      library tutorial. Each factory owns its internal rules and subscriptions. Disposal
      releases resources owned by each module, not injected dependencies; the root controls
      their lifetime. Server shutdown drains requests before closing dependencies. Production
      startup must unwind partially acquired resources on failure; omitted for slide length.
      Composition roots assemble modules; business orchestration belongs inside a cohesive
      application capability, such as checkout, rather than growing inside main.ts.
      Sources: https://blog.ploeh.dk/2011/07/28/CompositionRoot/ and
      https://blog.ploeh.dk/2015/01/06/composition-root-reuse/ and
      https://react.dev/learn/passing-data-deeply-with-context
    steps:
      - id: composition
        label: Server and client composition roots
        panel: composition-roots
        face: interface
