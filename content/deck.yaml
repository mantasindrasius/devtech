    name: Make policy visible. Prove it stays correct.
    label: CLEAN CODE
    title:
      - text: Make policy visible.
      - accent: Prove it stays correct.
    description: "BAD → BETTER → VERIFIED: nesting, clear priorities, behavioral examples."
    code: shipping-nested
    takeaway: Fewer lines are not the goal. Less hidden knowledge is.
    notes: >-
      [18:46–20:18 · 92 seconds]


      Both implementations have cyclomatic complexity C = 6 under a base-one convention counting
      each if and ternary as one decision. The nested version has five if statements; the guard
      version has four if statements and one ternary. Guard clauses reduce nesting, not the number
      of independent paths. Before/after behavior is verified against independent expected fees,
      including express priority over membership and the 4999/5000 threshold. Inputs here are
      already validated; monetary values are cents. The displayed zero-coverage CRAP score is a
      hypothetical baseline, not measured coverage of this repository. This is a focused policy
      example; an external quote interface would usually use named domain inputs instead of
      positional booleans.
    steps:
