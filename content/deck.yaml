      Start with the application core: real deep modules composed together and covered by
      in-memory tests that run in milliseconds on every change. Click to add the ports and
      adapters. Ports are contracts owned by the application. Inbound adapters invoke its use
      cases; outbound adapters implement contracts required by the core. The lines show
      connections, not compile-time dependency direction; infrastructure depends on
      application contracts. The six sides are a drawing convention, not six prescribed
      layers. The E2E suite exercises the whole system through its real adapters, so keep it
      for real infrastructure and deployed behavior and retain adapter contract tests.
