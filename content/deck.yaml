    notes: >-
      Lizard's documented CLI output is excerpted from
      https://github.com/terryyin/lizard/blob/master/README.rst (Example use).
      This is not output measured from this repository. Lizard reports complexity,
      not CRAP: coverage must come from a separate coverage report.
      CRAP = C² × (1 − coverage)³ + C, with coverage as a fraction.
      Reference: https://dx42.github.io/gmetrics/metrics/CrapMetric.html.
      The shipping snippets illustrate simpler covered code (C=2, coverage=100%, CRAP=2)
      versus expanded, untested policy (C=6, coverage=0%, CRAP=42).
      They represent different feature scopes, not equivalent refactorings.
      Coverage is assumed for illustration. Full coverage does not prove assertion quality.
      The simulated chat uses fictional file sizes and coverage; classifyOrder grows
      from C=3 at full coverage (CRAP=3) to C=8 at 50% coverage (CRAP=16).
      The final reply proposes cleanup rather than claiming verified work.
    steps:
