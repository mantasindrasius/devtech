    code: crap-worked-example
    takeaway: Combine coverage with assertion quality, locality, and coupling.
    notes: >-
      [20:18–21:25 · 67 seconds]


      CRAP combines cyclomatic complexity with uncovered code: C² × (1 − coverage)³ + C, using
      coverage as a fraction. Compare the worked example, not arbitrary score targets. Pair
      complexity with churn and incident history. Use coverage gaps to discover missing scenarios
      and difficult seams; do not add shallow assertions merely to reach a percentage. Enforce
      dependency rules and focused static analysis. The scores are investigation signals, not proof
      of good design.
