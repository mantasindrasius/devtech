  - id: software-worlds
    name: The evolution of software worlds
    label: OPENING
    layout: visual
    title:
      - text: The evolution of software worlds
    description: Monolith. Microservices. The AI era.
    code: introduction
    takeaway: Faster creation demands stronger boundaries and feedback.
    notes: >-
      A creation-story opening inspired by the atmosphere of Civilization I.
      In the beginning there was the monolith: one world with a dense, interconnected interior.
      Click: microservices distribute the modules among smaller worlds; connections remain.
      Click: AI accelerates creation. Existing worlds grow, volcanoes erupt, and strange new
      services appear. Speed amplifies the architecture we already have. This is a metaphor for
      uncontrolled change, not a claim that AI or microservices inevitably cause instability.
      Pause in each era; nothing advances to the next era without the clicker.
    steps:
      - id: monolith
        label: In the beginning, there was the monolith
        panel: planet-evolution
        scene: monolith
        caption: In the beginning, there was the monolith.
      - id: microservices
        label: Then microservices were invented
        panel: planet-evolution
        scene: microservices
        caption: Then microservices were invented.
      - id: ai-era
        label: Then the AI era came
        panel: planet-evolution
        scene: ai-era
        caption: Then the AI era came.
  - id: design-stamina
    name: Good design sustains delivery
    label: OPENING
    layout: visual
    title:
      - text: Good design sustains delivery.
    description: The slope is your delivery speed.
    code: introduction
    takeaway: Invest in the structure that makes the next change easier.
    notes: >-
      [Suggested duration: 60 seconds]

      Move from the planet story to the economics of change. This is an adaptation of Martin
      Fowler's Design Stamina Hypothesis, not an empirical graph. The vertical axis is cumulative
      functionality, not velocity; velocity is the slope. The horizontal axis is time, not codebase
      size. Neglecting design can give an initial lead, followed by slower delivery. Good design
      supports sustained change. The crossing point is illustrative and has no calibrated date.
      Source: https://martinfowler.com/bliki/DesignStaminaHypothesis.html

      Do not equate cleanliness, small functions or more modules with lower complexity. The
      follow-up research question is how branching, coupling and the task's dependency scope
      affect agent cost per merged PR across its full lifecycle. References and limitations are saved in BRAINSTORM.md.

      Advance once for architectural coupling versus maintenance cost. Table 6, System C,
      reports peripheral 0.71, shared 0.80, control 1.25 and core 2.31 USD per LOC per year.
      The ratio 2.31 / 0.71 is approximately 3.25, based on rounded published values.
      Categories describe dependency structure, not deployment styles or a continuous scale.
      Labels simplify the study terms: peripheral has lower dependency reach in both
      directions; shared is depended on by many but depends on few; control depends on
      many but is depended on by few. Core is the largest cyclic dependency group, not
      a synonym for business-domain code. Reach includes indirect dependencies, and high
      and low are relative to the core in this classification.
      Costs allocate total corrective-maintenance hours at 100 dollars/hour according to
      defect-related activity, assuming equal cost per activity. This financial comparison
      does not control for cyclomatic complexity. It is not cost per change, AI-token usage,
      or evidence that refactoring causes a 3.25-fold saving. Emphasize modularity and local
      changes in either monoliths or microservices. AI cost through merge remains a separate
      research question. Source: MacCormack and Sturtevant (2016), Table 6, System C.

      Advance again for The complexity tax: code-level maintainability, measured through
      composite CodeHealth rather than complexity alone. The bars use published fitted
      tier contrasts normalized per model, not raw token averages. Intervals are omitted.
      CodeHealth and file size cannot be separated here; no causal savings are established.
      Only review and fixes are measured, not the full PR lifecycle.
      Source: https://arxiv.org/html/2610.21914v1 section 4.2.
    steps:
      - id: design-stamina
        label: Design sustains delivery
        panel: design-stamina
      - id: coupling-cost
        label: The coupling tax — architectural modularity
        panel: coupling-cost
      - id: complexity-cost
        label: The complexity tax — code-level maintainability
        panel: complexity-cost
  - id: ease-of-change
    name: Ease of change
    label: OPENING
    layout: visual
    title:
      - text: Ease of change
    description: Good boundaries make change easier.
    code: introduction
    takeaway: Keep dependencies organized and changes local.
    notes: >-
      Compare a tightly coupled monolith with a decoupled design. Intertwined file-level
      dependencies and scattered logic make changes risky. Organized dependencies and
      cohesive modules reduce the scope to understand and verify. Monolithic deployment
      does not require tangled architecture: a modular monolith can satisfy the right column.
      Faster and cheaper development is the design objective, not a guaranteed saving.
    steps:
      - id: ease-of-change
        label: Ease of change
        panel: ease-of-change
  - id: context-cost
    hidden: true
    name: Five lines of change. Half a repo of context.
    label: OPENING
    layout: visual
    title:
      - text: Five lines of change.
      - accent: Half a repo of context.
    description: An existing monolith. It works.
    code: introduction
    takeaway: A tiny change can depend on the whole structure.
    notes: >-
      [1:07–2:55 · 108 seconds]


      Start with a working monolith on the language runtime. Advance the clicker through each new
      stacked ring, then each pipe and patch. Let the workarounds accumulate before adding another
      ring. Gas leaks grow stronger and spread to more joints. One final addition blows the lid off
      and throws every temporary patch clear. Brace the damaged monolith to keep it running, then
      begin the rewrite. Build several smaller towers and connect them. The exposed pipes burst and
      get patched; underwater pipes reveal hidden coupling. End on the larger system of workarounds.
      Ask the audience to recall a tiny change that required opening dozens of files. The diff may
      be small while the context needed to change safely spans the system.
    steps:
      - id: existing
        label: Existing monolith
        panel: project-stack
        scene: existing
        caption: The monolith works today.
        reveal:
          - description
      - id: features
        label: Add features
        panel: project-stack
        scene: features
        caption: A new layer grows on top.
        description: New features stack on the existing monolith.
      - id: workaround-pipe
        label: First workaround
        panel: project-stack
        scene: workaround-pipe
        caption: A workaround routes around the seam.
        description: The first workaround connects parts that were not designed together.
      - id: first-patch
        label: First patch
        panel: project-stack
        scene: first-patch
        caption: Seal one leaking joint. Keep shipping.
        description: A bolted plate seals the leaking joint, buying time without removing the dependency.
      - id: quick-fix-pipe
        label: Quick fix
        panel: project-stack
        scene: quick-fix-pipe
        caption: A quick fix adds another path.
        description: Another pipe reaches around the structure.
      - id: dependencies
        label: Another layer
        panel: project-stack
        scene: dependencies
        caption: Another ring lands on the patched system.
        description: The structure grows taller; its boundaries do not get clearer.
      - id: legacy-pipe
        label: Legacy path
        panel: project-stack
        scene: legacy-pipe
        caption: Seal the upper seam. Another leak is still venting.
        description: Old behavior remains connected to the growing system.
      - id: second-patch
        label: Another patch
        panel: project-stack
        scene: second-patch
        caption: Patch the next leaking pipe. Pressure finds another weak point.
        description: The repair becomes part of the design.
      - id: runtime-pipe
        label: Runtime workaround
        panel: project-stack
        scene: runtime-pipe
        caption: Another pipe, another leak to seal.
        description: Workarounds extend across more layers.
      - id: todo-pipe
        label: Unfinished pipe
        panel: project-stack
        scene: todo-pipe
        caption: Patch the lower pipe while the unfinished connection vents.
        description: An unfinished connection waits at the top.
      - id: fixme-pipe
        label: Another unfinished pipe
        panel: project-stack
        scene: fixme-pipe
        caption: Cap the open connection. The next joint starts leaking.
        description: The project now carries unfinished work in its structure.
      - id: failure
        label: Pressure overload
        panel: project-stack
        scene: failure
        caption: The lid blows off. Every temporary patch is thrown clear.
        description: A small change can trigger a system-wide failure.
        reveal:
          - takeaway
      - id: supported
        label: Brace the monolith
        panel: project-stack
        scene: supported
        caption: Keep it standing with braces.
      - id: rewrite
        label: Start the rewrite
        panel: project-stack
        scene: rewrite
        caption: Rewrite to microservices. Start with Auth.
      - id: services
        label: Split into services
        panel: project-stack
        scene: services
        caption: Billing and Search become separate towers.
      - id: service-rings
        label: Grow each service
        panel: project-stack
        scene: service-rings
        caption: Each small tower grows its own layers.
      - id: service-links
        label: Connect the islands
        panel: project-stack
        scene: service-links
        caption: Now the islands need pipes between them.
      - id: first-burst
        label: First burst
        panel: project-stack
        scene: first-burst
        caption: A pipe bursts.
      - id: first-repair
        label: Patch the first pipe
        panel: project-stack
        scene: first-repair
        caption: Patch it and keep moving.
      - id: underwater-pipes
        label: Reveal hidden coupling
        panel: project-stack
        scene: underwater-pipes
        caption: Underwater pipes connect the islands too.
      - id: second-burst
        label: Underwater gas leak
        panel: project-stack
        scene: second-burst
        caption: Gas bubbles rise from a hidden underwater leak.
      - id: second-repair
        label: Patch the hidden pipe
        panel: project-stack
        scene: second-repair
        caption: Another workaround, now below the surface.
      - id: sprawl
        label: The bigger system
        panel: project-stack
        scene: sprawl
        caption: More towers. More pipes. The same problem at a larger scale.
  - id: ai-era
    hidden: true
    name: Building in the AI era
    label: OPENING
    layout: visual
    title:
      - text: Building in the AI era.
    description: Fast additions can outpace the structure that keeps a project stable.
    code: introduction
    takeaway: More features do not imply a healthier system.
    notes: >-
      [2:55–4:12 · 77 seconds]


      Each click adds one spacecraft: foreground, left background, then far background. Each begins
      its own construction sequence. Pause to watch physical parts install, a different random
      subset of fairy-tale features bolt to each hull, and leaks emerge. Suited engineers raise
      ladders, remove unwanted features, and patch the exposed holes. More additions return while
      other joints leak; cleanup cannot catch up with generation. The engine incident is contained
      automatically, followed by unstable thrusters.
    steps:
      - id: shipyard
        label: Building in the AI era
        panel: ai-era-spaceship
