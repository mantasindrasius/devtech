      [1:07–2:55 · 108 seconds]


      Start with a working monolith on the language runtime. Advance the clicker through each new
      stacked ring, then each pipe and patch. Let the workarounds accumulate before adding another
      ring. Gas leaks grow stronger and spread to more joints. One final addition blows the lid off
      and throws every temporary patch clear. Brace the damaged monolith to keep it running, then
      begin the rewrite. Build several smaller towers and connect them. The exposed pipes burst and
      get patched; underwater pipes reveal hidden coupling. End on the larger system of workarounds.
      Ask the audience to recall a tiny change that required opening dozens of files. The diff may
      be small while the context needed to change safely spans the system.
