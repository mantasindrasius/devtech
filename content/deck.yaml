    takeaway: Use metrics to guide judgment, not to chase a score.
    notes: >-
      Cyclomatic complexity estimates independent execution paths. Tools such as lizard
      help locate functions worth inspecting; counts depend on language and tool conventions.
      CRAP combines cyclomatic complexity and test coverage to highlight change risk.
      Coverage alone does not establish meaningful assertions or correct behavior.
      Protect behavior with tests, simplify responsibilities and control flow, and rerun
      verification during PR cleanup. Do not reduce a score by hiding branches in helpers
      or replacing readable code with clever expressions. The following code example shows
      how guard clauses can improve readability without changing cyclomatic complexity.
