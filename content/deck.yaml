  - id: test-hygiene
    name: The ideal test
    label: TESTING
    layout: visual
    title:
      - text: The ideal test
    description: Fast to run. Deterministic. Assertive. Readable.
    code: introduction
    takeaway: Clear, trustworthy feedback keeps the loop short.
    notes: >-
      Emphasize the four attributes. Fast includes both building the tests and running them.
      Deterministic tests control time, randomness and external dependencies. Assertive means
      meaningful assertions that fail when behavior is wrong and explain what was expected;
      merely running code or checking a truthy result is often insufficient. Flaky results
      and vague assertions send agents into unnecessary diagnosis and retries. Readable tests
      express behavior in shared domain language so reviewers and agents can agree on intent.
      Prefer clear scenarios, explicit outcomes and small fixtures over clever test machinery.
    steps:
      - id: base
        label: A test with room to improve
        panel: test-hygiene
        scene: base
        caption: A database-backed test with random input and a vague assertion.
      - id: fast
        label: Fast to run
        panel: test-hygiene
        scene: fast
        caption: Fast builds and tests shorten every verification loop.
      - id: deterministic
        label: Deterministic
        panel: test-hygiene
        scene: deterministic
        caption: Repeatable results prevent wasted diagnosis and retries.
      - id: assertive
        label: Assertive
        panel: test-hygiene
        scene: assertive
        caption: Precise assertions explain what behavior is wrong.
      - id: readable
        label: Readable
        panel: test-hygiene
        scene: readable
        caption: Fluent tests express shared intent for humans and agents.
