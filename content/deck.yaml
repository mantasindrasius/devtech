    notes: >-
      Reference: Michael Feathers, Working Effectively with Legacy Code. Characterization
      tests record existing behavior; seams create places to isolate dependencies. See the
      publisher sample on the seam model:
      https://ptgmedia.pearsoncmg.com/images/9780131177055/samplepages/0131177052.pdf
      First write down the target system design: dependency direction, approved patterns,
      examples and forbidden coupling. Reference that design from the planning skill so every
      plan is made with the destination in view. Instruct the skill to follow each regular PR
      with a refactoring PR of proportional size that moves the touched code closer to the
      target design. Keep the follow-up scoped and reviewable.
