    name: "SOLID: open for extensions"
    label: ARCHITECTURE FOR AGENTS
    title:
      - text: SOLID boundaries.
      - accent: Open for extensions.
    description: Add a capability through a focused contract, an implementation and composition.
    code: solid-extension
    takeaway: A new behavior should have an obvious home.
    notes: >-
      [11:53–12:56 · 63 seconds]


      S: separate policy, I/O and composition. O: provide deliberate extension points. L: preserve
      observable behavior, errors and completion semantics across implementations. I: expose only
      what the consumer needs. D: inject capabilities rather than importing concrete infrastructure.


      Use Strategy for interchangeable behavior, Adapter for external systems, and a registry when
      named implementations need selection. Patterns should reduce the number of places an agent
      must understand and edit. The notification example adds a channel at the composition root
      without putting channel-specific branches into confirmation policy. Verify each notifier
      against the same contract, including failures. Do not build speculative abstractions.
