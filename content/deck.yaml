  - id: overlap-work
    name: When slow checks are unavoidable
    label: EXTRA TIPS
    title:
      - text: Keep moving while CI runs.
    description: Smaller build units, in-memory tests, remote capacity and PR stacks.
    code: introduction
    takeaway: Decouple progress from waiting.
    notes: >-
      [33:59–35:11 · 72 seconds]


      First reduce the affected graph and isolate expensive boundaries. Parallelize independent
      tasks; use in-memory tests for policy plus real adapter checks. On a congested laptop, offload
      verification to CI or remote development machines. Agents must read logs and associate
      evidence with the exact revision. Stack independent next steps while checks run, but do not
      merge unverified work. Revalidate descendants when a parent changes.
