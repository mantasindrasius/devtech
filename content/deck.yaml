  - id: design-stamina
    name: Good design sustains delivery
    label: OPENING
    layout: visual
    title:
      - text: Good design sustains delivery.
    description: The slope is your delivery speed.
    code: introduction
    takeaway: Invest in the structure that makes the next change easier.
    notes: >-
      [Suggested duration: 60 seconds]

      Move from the planet story to the economics of change. This is an adaptation of Martin
      Fowler's Design Stamina Hypothesis, not an empirical graph. The vertical axis is cumulative
      functionality, not velocity; velocity is the slope. The horizontal axis is time, not codebase
      size. Neglecting design can give an initial lead, followed by slower delivery. Good design
      supports sustained change. The crossing point is illustrative and has no calibrated date.
      Source: https://martinfowler.com/bliki/DesignStaminaHypothesis.html

      Do not equate cleanliness, small functions or more modules with lower complexity. The
      follow-up research question is how branching, coupling and the task's dependency scope
      affect agent cost per merged PR across its full lifecycle. References and limitations are saved in BRAINSTORM.md.
    steps:
      - id: design-stamina
        label: Design sustains delivery
        panel: design-stamina
  - id: coupling-cost
    name: The coupling tax
    label: OPENING
    layout: visual
    title:
      - text: The coupling tax
    description: Architectural coupling and maintenance cost.
    code: introduction
    takeaway: Architectural coupling and maintenance cost.
    notes: >-
      Architectural coupling versus maintenance cost. Table 6, System C,
      reports peripheral 0.71, shared 0.80, control 1.25 and core 2.31 USD per LOC per year.
      The ratio 2.31 / 0.71 is approximately 3.25, based on rounded published values.
      Categories describe dependency structure, not deployment styles or a continuous scale.
      Labels simplify the study terms: peripheral has lower dependency reach in both
      directions; shared is depended on by many but depends on few; control depends on
      many but is depended on by few. Core is the largest cyclic dependency group, not
      a synonym for business-domain code. Reach includes indirect dependencies, and high
      and low are relative to the core in this classification.
      Costs allocate total corrective-maintenance hours at 100 dollars/hour according to
      defect-related activity, assuming equal cost per activity. This financial comparison
      does not control for cyclomatic complexity. It is not cost per change, AI-token usage,
      or evidence that refactoring causes a 3.25-fold saving. Emphasize modularity and local
      changes in either monoliths or microservices. AI cost through merge remains a separate
      research question. Source: MacCormack and Sturtevant (2016), Table 6, System C.
    steps:
      - id: chart
        label: The coupling tax
        panel: coupling-cost
  - id: complexity-cost
    name: The complexity tax
    label: OPENING
    layout: visual
    title:
      - text: The complexity tax
