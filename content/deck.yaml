      - text: 'Plan A: rewrite the system'
    description: It is cheap now, and cheaper still with existing tests.
    code: introduction
    takeaway: With agents and a test suite, a rewrite is a realistic first option.
    notes: >-
      Agents make rewriting cheap, so consider it first. An existing test suite makes it
      cheaper still: the tests define the behavior the new system must preserve and let
      agents verify their own work. Evaluate rewriting a bounded capability when it removes
      substantial accidental complexity and behavior can be preserved and verified. Compare
      domain knowledge, migration cost, compatibility, parallel running and rollback.
      Optimized code with lost behavior is not progress. When a rewrite is not viable, move
      to plan B.
